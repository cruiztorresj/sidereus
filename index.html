		<script type="text/javascript">
			// Consider putting all this in a separate file.
			const sidereusBGM = new Audio('sounds/Sidereus.mp3');
			const gui = new Gui();
			const state = new State();
			const weapon = new Weapon();
			const apparatus = new Apparatus();
			const hero = new Melencolie(weapon); // There will be more heroes.
			const level = new Level(hero, Constants.LEVEL_EASY, apparatus);

			const sidereus = new Sidereus(level, drawer, state);
			const main = new Main(gui, state, sidereus, sidereusBGM);
